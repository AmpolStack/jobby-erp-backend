      password: d0P!fy641H^*
    mongodb:
      username: jobby-root
      password: jRq2)24
      database: user_service_db
      port: 27017
      host: localhost
      authentication-database: admin
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  kafka:
    bootstrap-servers:
      - localhost:9093
      - localhost:9094
      - localhost:9095
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.apicurio.registry.serde.avro.AvroKafkaDeserializer
      properties:
        apicurio.registry.url: http://localhost:8091
        apicurio.registry.use-specific-avro-reader: true
        apicurio.registry.headers.enabled: false
        apicurio.registry.use-id: contentId
        apicurio.registry.id-handler: io.apicurio.registry.serde.Legacy4ByteIdHandler
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: com.jobby.infrastructure.serde.DualAvroKafkaSerializer
      properties:
        apicurio.registry.url: http://localhost:8091
        apicurio.registry.auto-register: true
        apicurio.registry.serde.avro.auto-register: true
        apicurio.registry.headers.enabled: true
        apicurio.registry.use-id: contentId
        apicurio.registry.id-handler: io.apicurio.registry.serde.Legacy4ByteIdHandler

