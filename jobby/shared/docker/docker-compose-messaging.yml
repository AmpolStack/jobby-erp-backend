name: messaging
services:
  controller:
    image: apache/kafka:4.0.0
    container_name: controller
    ports:
      - "9092:9092"
    environment:
      KAFKA_PROCESS_ROLES: "controller"
      KAFKA_NODE_ID: "1"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "CONTROLLER://0.0.0.0:9092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-controller localhost:9092 describe --status > /dev/null 2>&1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - controller-data:/var/lib/kafka/data
    networks:
      - messaging-network

  first-broker:
    image: apache/kafka:4.0.0
    container_name: first-broker
    ports:
      - "9093:19093"
    environment:
      KAFKA_PROCESS_ROLES: "broker"
      KAFKA_NODE_ID: "2"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9093,EXTERNAL://0.0.0.0:19093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://first-broker:9093,EXTERNAL://localhost:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    networks:
      - messaging-network
    volumes:
      - first-broker-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9093 > /dev/null 2>&1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      - controller

  second-broker:
    image: apache/kafka:4.0.0
    container_name: second-broker
    ports:
      - "9094:19094"
    environment:
      KAFKA_PROCESS_ROLES: "broker"
      KAFKA_NODE_ID: "3"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9094,EXTERNAL://0.0.0.0:19094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://second-broker:9094,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    networks:
      - messaging-network
    volumes:
      - second-broker-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 > /dev/null 2>&1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      - controller

  third-broker:
    image: apache/kafka:4.0.0
    container_name: third-broker
    ports:
      - "9095:19095"
    environment:
      KAFKA_PROCESS_ROLES: "broker"
      KAFKA_NODE_ID: "4"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9095,EXTERNAL://0.0.0.0:19095"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://third-broker:9095,EXTERNAL://localhost:9095"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    networks:
      - messaging-network
    volumes:
      - third-broker-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9095 > /dev/null 2>&1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      - controller

  kafka-init:
    image: apache/kafka:4.0.0
    container_name: kafka-init
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for brokers to be ready..."
        for broker in first-broker:9093 second-broker:9094 third-broker:9095; do
          until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server $$broker > /dev/null 2>&1; do
            echo "Waiting for $$broker..."
            sleep 3
          done
          echo "$$broker is ready"
        done
        echo "Creating topics..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server first-broker:9093 --create --if-not-exists \
          --topic kafkasql-journal --partitions 1 --replication-factor 3 \
          --config cleanup.policy=delete --config retention.ms=-1 --config retention.bytes=-1 \
          --config min.insync.replicas=2
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server first-broker:9093 --create --if-not-exists \
          --topic kafkasql-snapshots --partitions 1 --replication-factor 3 \
          --config cleanup.policy=delete --config retention.ms=-1 --config retention.bytes=-1 \
          --config min.insync.replicas=2
        echo "Topics created successfully"
    networks:
      - messaging-network
    depends_on:
      first-broker:
        condition: service_started
      second-broker:
        condition: service_started
      third-broker:
        condition: service_started

  schema-registry:
    image: apicurio/apicurio-registry:3.3
    container_name: schema-registry
    ports:
      - "8091:8080"
    environment:
      APICURIO_STORAGE_KIND: kafkasql
      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: first-broker:9093,second-broker:9094,third-broker:9095
    networks:
      - messaging-network
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      first-broker:
        condition: service_started
      second-broker:
        condition: service_started
      third-broker:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/health/ready || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-ui:
    container_name: kafka-ui
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8092:8081"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      SERVER_PORT: 8081
    volumes:
      - ./sources/kafka-ui/dynamic_config.yml:/etc/kafkaui/dynamic_config.yaml
    networks:
      - messaging-network
    depends_on:
      first-broker:
        condition: service_healthy
      schema-registry:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8081/actuator/health 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

