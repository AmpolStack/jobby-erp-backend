name: jobby-shared


include:
  - docker-compose-messaging.yml
  - docker-compose.monitoring.yml

services:
  # File Storage Server
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-server
    ports:
      - "9000:9000" # Console
      - "9001:9001" # UI
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_ROOT_USER}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_ROOT_PASSWORD}
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    networks:
      - storage-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Cache Service
  redis:
    image: redis:7.4-alpine
    container_name: redis-server
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - cache-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # SMTP Service
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit-server
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI
    networks:
      - email-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8025" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  storage-network:
    name: jobby-storage-network
    driver: bridge
  cache-network:
    name: jobby-cache-network
    driver: bridge
  email-network:
    name: jobby-email-network
    driver: bridge

volumes:
  rustfs_data:
  rustfs_logs:
  redis_data:
