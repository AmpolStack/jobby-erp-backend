name: monitoring
services:
  # Meter Registry Service
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-server
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./sources/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - monitoring-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Log Repository Service
  loki:
    image: grafana/loki:latest
    container_name: loki-server
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - monitoring-network
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Tracing Repository Service
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin-server
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - monitoring-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9411/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Observability Service
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./sources/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./sources/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring-network
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  monitoring-network:
    name: jobby-monitoring-network
    driver: bridge

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
