apiVersion: 1

datasources:

  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"

  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    editable: true
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '\[[\w-]+,([a-f0-9]{32}|[a-f0-9]{16}),[\w-]+\]'
          url: '$${__value.raw}'
          datasourceUid: zipkin

  - name: Zipkin
    type: zipkin
    uid: zipkin
    url: http://zipkin:9411
    editable: true