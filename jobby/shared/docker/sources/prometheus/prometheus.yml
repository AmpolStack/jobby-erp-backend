global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'local'

scrape_configs:

  # Self monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # User service
  - job_name: 'user-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
    # On Linux
    # - targets: ['172.17.0.1:8080']